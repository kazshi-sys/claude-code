  <linearGradient id="khaki" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a7a181"/><stop offset=".45" stop-color="#8b8566"/><stop offset="1" stop-color="#6c674d"/></linearGradient>
